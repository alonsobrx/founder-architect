name: Observatory accessibility defect
description: Report a keyboard, screen-reader, zoom, contrast, reflow, language, or comprehension barrier.
title: "[Observatory accessibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve access. Do not include personal claim, medical, identity, credential, or confidential client information.
  - type: input
    id: page
    attributes:
      label: Page or section
      description: Identify the English or Spanish page and the affected section.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, browser, and assistive technology
      description: Example: Android 16, Chrome, TalkBack; or Windows 11, Firefox, NVDA.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What accessible behavior was expected
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Functional impact
      options:
        - Blocks access to essential content or controls
        - Makes access substantially harder
        - Causes confusion or incorrect reading order
        - Minor barrier or enhancement
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm that this report contains no personal claim, medical, identity, credential, or confidential client information.
          required: true
