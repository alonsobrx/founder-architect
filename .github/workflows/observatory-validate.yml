name: Observatory validation

on:
  push:
    branches: [main]
    paths:
      - "observatory/**"
      - ".github/workflows/observatory-validate.yml"
  pull_request:
    paths:
      - "observatory/**"
      - ".github/workflows/observatory-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatory-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile, recalculate, validate, and security-audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m py_compile \
            observatory/scripts/recalculate_metrics.py \
            observatory/scripts/validate_observatory.py \
            observatory/scripts/security_audit.py
          python observatory/scripts/recalculate_metrics.py --check
          python observatory/scripts/validate_observatory.py
          python observatory/scripts/security_audit.py --repository-root .
