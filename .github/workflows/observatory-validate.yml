name: Observatory validation

on:
  push:
    branches: [main]
    paths:
      - "observatory/**"
      - ".github/workflows/observatory-validate.yml"
  pull_request:
    paths:
      - "observatory/**"
      - ".github/workflows/observatory-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatory-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile, recalculate, validate, and security-audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m py_compile \
            observatory/scripts/recalculate_metrics.py \
            observatory/scripts/validate_observatory.py \
            observatory/scripts/security_audit.py
          python observatory/scripts/recalculate_metrics.py --check
          python observatory/scripts/validate_observatory.py
          python observatory/scripts/security_audit.py --repository-root .
